<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X11 mock — agents and permissions</title>
<link rel="stylesheet" href="../../../dashboard/static/fonts.css">
<link rel="stylesheet" href="../../../dashboard/static/style.css">
<style>
  :root { color-scheme: dark; }
  html, body { height: auto; min-height: 100%; }
  body {
    display: flex; height: 100vh; overflow: hidden;
    background: var(--bg-base); color: var(--text-main);
  }
  .x-side {
    width: 218px; min-width: 218px; border-right: 1px solid var(--border-color);
    background: rgba(15,13,10,.66); padding: 18px 12px 16px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .x-brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 10px; }
  .x-brand img { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--accent-glow); }
  .x-brand b { display: block; font-size: 13px; letter-spacing: .3px; }
  .x-brand span { display: block; font-size: 10px; color: var(--text-muted); }
  .x-nav-label { padding: 6px 10px 2px; color: var(--text-faint); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
  .x-nav a {
    display: block; padding: 7px 10px; border-radius: 6px; color: var(--text-dim);
    text-decoration: none; font-size: 12px; line-height: 1.25;
  }
  .x-nav a.active { color: var(--accent); background: var(--accent-wash); }
  .x-nav a:hover { background: var(--bg-hover); color: var(--text-main); }
  .x-side-bottom { margin-top: auto; border-top: 1px solid var(--border-weak, rgba(240,230,212,.09)); padding-top: 12px; }
  .x-main {
    flex: 1; min-width: 0; overflow: auto; position: relative;
    background:
      radial-gradient(ellipse 70% 45% at 78% -10%, rgba(46,72,132,.16), transparent 70%),
      radial-gradient(1px 1px at 18% 14%, rgba(205,216,230,.22) 50%, transparent 51%),
      radial-gradient(1px 1px at 72% 28%, rgba(205,216,230,.16) 50%, transparent 51%),
      radial-gradient(1px 1px at 44% 72%, rgba(205,216,230,.12) 50%, transparent 51%);
  }
  .x-page { max-width: 1180px; margin: 0 auto; padding: 30px 38px 64px; }
  .x-top { display: flex; align-items: start; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
  h1 { font-family: var(--serif); font-size: 30px; font-weight: 400; letter-spacing: -.01em; margin: 0 0 5px; }
  .x-sub { color: var(--text-muted); font-size: 13px; max-width: 640px; }
  h2 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  h3 { font-size: 13px; font-weight: 600; margin: 0; }
  .x-btn {
    border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);
    border-radius: 6px; padding: 7px 12px; font-size: 12px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .x-btn.primary { background: var(--accent); border-color: var(--accent); color: #171006; }
  .x-btn.ghost { background: transparent; }
  .x-btn.link { border: 0; background: none; color: var(--text-muted); padding: 2px 0; }
  .x-btn.link:hover { color: var(--text-main); }
  .x-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .x-card {
    background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 10px;
    padding: 16px; min-width: 0;
  }
  .x-agent-card { display: flex; flex-direction: column; min-height: 198px; }
  .x-agent-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
  .x-agent-name { font-size: 15px; font-weight: 600; line-height: 1.2; }
  .x-last { color: var(--text-muted); font-size: 11px; margin: 3px 0 16px; }
  .x-status { color: var(--state-approved); font-size: 11px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .x-status i { width: 6px; height: 6px; border-radius: 50%; background: var(--state-approved); display: inline-block; }
  .x-outcomes { display: grid; gap: 8px; margin-bottom: 16px; }
  .x-outcome { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; }
  .x-outcome span:first-child { color: var(--text-muted); }
  .x-outcome span:last-child { text-align: right; color: var(--text-main); }
  .x-agent-card .x-btn { margin-top: auto; align-self: flex-start; }
  .x-new {
    border: 1px dashed var(--border-color); background: transparent; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; min-height: 198px;
    color: var(--text-muted); font-size: 13px; gap: 8px;
  }
  .x-new b { font-size: 20px; font-weight: 300; color: var(--text-dim); }
  .x-note { color: var(--text-muted); font-size: 11px; }
  .x-hr { height: 1px; background: var(--border-color); margin: 20px 0; border: 0; }
  .x-section { margin-top: 26px; }
  .x-section-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 12px; }
  .x-section-head .x-note { max-width: 520px; }
  .x-outcome-key { display: flex; flex-wrap: wrap; gap: 16px; margin: 16px 0 4px; font-size: 12px; color: var(--text-muted); }
  .x-outcome-key span { display: inline-flex; align-items: center; gap: 6px; }
  .x-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .x-dot.run { background: var(--state-approved); }
  .x-dot.ask { background: var(--state-pending); }
  .x-dot.never { background: var(--state-denied); }
  .x-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .x-summary-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 14px; background: rgba(255,255,255,.015); }
  .x-summary-card b { display: block; font-size: 12px; margin-bottom: 3px; }
  .x-summary-card span { font-size: 12px; color: var(--text-muted); }
  /* Agent page */
  .x-agent-layout { display: grid; grid-template-columns: 238px minmax(0, 1fr); gap: 28px; align-items: start; }
  .x-agent-layout > * { min-width: 0; }
  .x-sidecard { position: sticky; top: 24px; }
  .x-person { font-size: 17px; font-weight: 600; }
  .x-token { margin-top: 12px; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .x-anchors { margin-top: 22px; display: grid; gap: 2px; }
  .x-anchors a { display: flex; justify-content: space-between; gap: 10px; padding: 7px 8px; border-radius: 5px; text-decoration: none; color: var(--text-muted); font-size: 12px; }
  .x-anchors a.active, .x-anchors a:hover { color: var(--text-main); background: var(--bg-hover); }
  .x-anchors a span { color: var(--text-faint); font-size: 11px; }
  .x-panel { border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-surface); overflow: hidden; }
  .x-panel-head { display: flex; justify-content: space-between; align-items: start; gap: 14px; padding: 16px 18px; border-bottom: 1px solid var(--border-color); }
  .x-panel-body { padding: 16px 18px; }
  .x-device-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .x-device-table th { text-align: left; color: var(--text-faint); font-size: 11px; font-weight: 500; padding: 10px 8px 8px; letter-spacing: .01em; text-transform: none; }
  .x-device-table th:first-child { padding-left: 0; }
  .x-device-table td { padding: 10px 8px; border-top: 1px solid rgba(240,230,212,.07); font-size: 12px; vertical-align: middle; }
  .x-device-table td:first-child { padding-left: 0; }
  .x-device-name { font-weight: 500; }
  .x-device-meta { color: var(--text-muted); font-size: 10px; margin-top: 2px; }
  .x-device-state { color: var(--text-muted); font-size: 11px; }
  .x-protected { color: var(--text-faint); font-size: 11px; display: inline-flex; align-items: center; gap: 5px; }
  .x-protected-row td:nth-child(4) { display: none; }
  .x-protected-row td:nth-child(3)::before, .x-protected-row td:nth-child(4)::before { content: none; }
  .x-lock { width: 8px; height: 7px; border: 1px solid currentColor; border-radius: 1px; position: relative; display: inline-block; }
  .x-lock::before { content: ''; position: absolute; left: 1px; top: -5px; width: 4px; height: 4px; border: 1px solid currentColor; border-bottom: 0; border-radius: 3px 3px 0 0; }
  .x-menu { width: 32px; height: 30px; border: 1px solid var(--border-color); border-radius: 6px; display: inline-flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 7px; }
  .x-menu i { display: block; height: 1px; background: var(--text-dim); }
  .x-check { width: 15px; height: 15px; border: 1px solid var(--border-color); border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; color: #171006; background: var(--bg-base); font-size: 10px; }
  .x-check.on { background: var(--accent); border-color: var(--accent); }
  .x-check.off { background: transparent; }
  .x-check.disabled { opacity: .35; }
  .x-device-group { padding: 10px 0 3px; color: var(--text-faint); font-size: 10px; letter-spacing: .04em; }
  .x-hint { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 11px; }
  .x-links { display: flex; gap: 18px; margin-top: 12px; font-size: 12px; }
  .x-links a { color: var(--text-muted); text-decoration: none; }
  .x-links a:hover { color: var(--text-main); }
  /* Editor */
  .x-editor { border: 1px solid var(--accent-line); border-radius: 10px; background: var(--bg-surface); overflow: hidden; box-shadow: 0 0 0 1px rgba(245,158,11,.04); }
  .x-editor-head { padding: 16px 18px 0; }
  .x-editor-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border-color); }
  .x-search { min-width: 210px; flex: 1; background: var(--bg-base); border: 1px solid var(--border-color); border-radius: 5px; color: var(--text-main); padding: 7px 10px; font-size: 12px; }
  .x-chip { border: 1px solid var(--border-color); border-radius: 20px; padding: 4px 9px; color: var(--text-muted); font-size: 11px; white-space: nowrap; }
  .x-chip.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-wash); }
  .x-editor .x-device-table { margin: 4px 18px 0; width: calc(100% - 36px); }
  .x-editor-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px 16px; border-top: 1px solid var(--border-color); }
  .x-labelbox { margin: 12px 18px 0; border: 1px solid var(--border-color); border-radius: 7px; padding: 11px 12px; background: rgba(255,255,255,.015); display: flex; justify-content: space-between; gap: 14px; align-items: start; }
  .x-labelbox p { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .x-limit-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); }
  .x-limit-row input { width: 54px; background: var(--bg-base); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 4px; padding: 4px 6px; font-size: 12px; }
  /* Preview */
  .x-preview { border: 1px solid var(--state-approved); border-radius: 10px; background: rgba(74,222,128,.04); padding: 18px; }
  .x-preview h3 { font-size: 14px; margin-bottom: 6px; }
  .x-preview p { font-size: 13px; color: var(--text-main); line-height: 1.55; }
  .x-preview .x-note { margin-top: 8px; }
  .x-changes { margin-top: 14px; display: grid; gap: 6px; font-size: 12px; }
  .x-changes span { color: var(--text-muted); }
  .x-changes b { color: var(--text-main); font-weight: 500; }
  .x-savebar { position: static; margin: 20px -38px -64px; padding: 12px 38px; background: rgba(15,13,10,.94); border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 10px; align-items: center; backdrop-filter: blur(10px); }
  .x-savebar span { margin-right: auto; color: var(--text-muted); font-size: 12px; }
  /* Overview */
  .x-suspended { border: 1px solid var(--state-pending); background: rgba(251,191,36,.05); border-radius: 9px; padding: 14px 16px; margin-bottom: 18px; }
  .x-suspended-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
  .x-suspended p { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
  .x-agent-block { border: 1px solid var(--border-color); border-radius: 9px; background: var(--bg-surface); padding: 16px 18px; margin-bottom: 12px; }
  .x-agent-block-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
  .x-perm { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-top: 1px solid rgba(240,230,212,.07); font-size: 12px; }
  .x-perm:first-of-type { border-top: 0; }
  .x-perm div { min-width: 0; }
  .x-perm b { font-weight: 500; }
  .x-perm span { color: var(--text-muted); }
  .x-perm-actions { display: flex; gap: 10px; white-space: nowrap; }
  .x-bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 24px; }
  .x-collapsed { border: 1px solid var(--border-color); border-radius: 8px; padding: 13px 15px; background: var(--bg-surface); }
  .x-collapsed summary { cursor: pointer; font-size: 13px; font-weight: 500; }
  .x-collapsed p { color: var(--text-muted); font-size: 11px; margin-top: 7px; }
  .x-protected-list { display: grid; gap: 8px; margin-top: 10px; }
  .x-mobile { display: none; }
  @media (max-width: 980px) {
    .x-grid { grid-template-columns: 1fr 1fr; }
    .x-agent-layout { grid-template-columns: minmax(0, 1fr); }
    .x-sidecard { position: static; }
    .x-anchors { display: flex; flex-wrap: wrap; gap: 2px; }
    .x-anchors a { padding: 6px 8px; }
  }
  @media (max-width: 700px) {
    body { display: block; height: auto; overflow: auto; }
    .x-side { display: none; }
    .x-mobile {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 16px 10px; border-bottom: 1px solid var(--border-color);
      position: sticky; top: 0; background: rgba(15,13,10,.94); z-index: 5;
    }
    .x-mobile .x-brand { padding: 0; }
    .x-mobile .x-brand img { width: 28px; height: 28px; }
    .x-main { overflow: visible; }
    .x-page { padding: 22px 16px 56px; }
    h1 { font-size: 26px; }
    .x-top { display: block; }
    .x-top .x-btn { margin-top: 12px; }
    .x-grid { grid-template-columns: 1fr; }
    .x-summary { grid-template-columns: 1fr; }
    .x-agent-card { min-height: 0; }
    .x-new { min-height: 84px; }
    .x-section-head { align-items: start; }
    .x-device-table thead { display: none; }
    .x-device-table, .x-device-table tbody, .x-device-table tr, .x-device-table td { display: block; width: 100%; }
    .x-device-table tr { border-top: 1px solid rgba(240,230,212,.07); padding: 9px 0; display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px 10px; align-items: center; }
    .x-device-table td { border: 0; padding: 0; width: auto; }
    .x-device-table tr { width: auto; }
    .x-device-table td:first-child { grid-column: 1 / -1; padding-bottom: 2px; }
    .x-device-table td:nth-child(2) { display: none; }
    .x-device-table td:nth-child(3)::before { content: 'Off'; color: var(--text-faint); font-size: 10px; margin-right: 4px; }
    .x-device-table td:nth-child(4)::before { content: 'On'; color: var(--text-faint); font-size: 10px; margin-right: 4px; }
    .x-device-table .x-check { vertical-align: middle; }
    .x-device-table .x-protected { grid-column: 2 / -1; }
    .x-device-table .x-protected-row td:nth-child(4) { display: none; }
    .x-device-table .x-protected-row td:nth-child(3)::before, .x-device-table .x-protected-row td:nth-child(4)::before { content: none; }
    .x-device-table { width: 100%; min-width: 0; max-width: 100%; table-layout: fixed; }
    .x-editor .x-device-table { width: calc(100% - 28px); min-width: 0; max-width: none; margin: 10px 14px 0; table-layout: fixed; }
    .x-device-table tr, .x-device-table td, .x-device-name, .x-device-meta { min-width: 0; overflow-wrap: anywhere; }
    .x-editor-tools { padding: 12px 14px; }
    .x-editor-tools .x-search { flex-basis: 100%; min-width: 0; }
    .x-editor-head { padding: 14px 14px 0; }
    .x-editor-foot { padding: 12px 14px; flex-wrap: wrap; }
    .x-labelbox { margin: 10px 14px 0; display: block; }
    .x-labelbox .x-btn { margin-top: 8px; }
    .x-panel-head, .x-panel-body { padding-left: 14px; padding-right: 14px; }
    .x-savebar { margin: 16px -16px -56px; padding: 10px 16px; }
    .x-bottom-grid { grid-template-columns: 1fr; }
    .x-perm { display: block; }
    .x-perm-actions { margin-top: 5px; display: flex; justify-content: flex-end; }
    .x-suspended-head { display: block; }
    .x-suspended-head .x-btn { margin-top: 9px; }
  }
</style>
</head>
<body>
<aside class="x-side">
  <div class="x-brand">
    <img src="../../../dashboard/static/brand/eshu-mark.svg" alt="">
    <div><b>Eshu</b><span>Gateway</span></div>
  </div>
  <div class="x-nav">
    <div class="x-nav-label">Command</div>
    <a href="#">Command Center</a><a href="#">History</a><a href="#">Statistics</a><a href="#">Approved Windows</a>
    <div class="x-nav-label">Fleet</div>
    <a href="#">Gateways</a><a href="#">Fleet Run</a><a href="#">Integrations</a>
    <div class="x-nav-label">Configure</div>
    <a href="#" id="nav-agents">Agents</a>
    <a href="#" id="nav-permissions">Runs without asking</a>
    <a href="#">Command policy</a><a href="#">Settings</a>
  </div>
  <div class="x-side-bottom">
    <div class="x-note" style="padding:0 10px 8px">Freeze</div>
  </div>
</aside>

<div class="x-main">
  <div class="x-mobile">
    <div class="x-brand"><img src="../../../dashboard/static/brand/eshu-mark.svg" alt=""><div><b>Eshu</b><span>Gateway</span></div></div>
    <button class="x-menu" aria-label="Open navigation"><i></i><i></i><i></i></button>
  </div>
  <main class="x-page" id="page"></main>
</div>

<script>
const view = new URLSearchParams(location.search).get('view') || 'agents';
document.getElementById('nav-agents').classList.toggle('active', !['overview'].includes(view));
document.getElementById('nav-permissions').classList.toggle('active', view === 'overview');

const card = (name, used, rows) => `
  <article class="x-card x-agent-card">
    <div class="x-agent-head"><div><div class="x-agent-name">${name}</div><div class="x-last">Last used ${used}</div></div><span class="x-status"><i></i>Active</span></div>
    <div class="x-outcomes">${rows.map(([k,v]) => `<div class="x-outcome"><span>${k}</span><span>${v}</span></div>`).join('')}</div>
    <button class="x-btn ghost">Open</button>
  </article>`;

const agentsPage = () => `
  <div class="x-top"><div><h1>Agents</h1><p class="x-sub">What each agent can do on its own, and what still comes to you.</p></div></div>
  <div class="x-grid">
    <button class="x-new"><b>+</b> New agent</button>
    ${card('household-agent', '4 minutes ago', [['Runs without asking','6 devices in Home Assistant'],['Asks you first','other Home Assistant services'],['SSH','none'],['Websites','5 sites']])}
    ${card('study-agent', 'yesterday', [['Runs without asking','3 lights in the study'],['Asks you first','everything else'],['SSH','none'],['Websites','2 sites']])}
    ${card('garden-agent', '3 days ago', [['Runs without asking','2 garden lights'],['Asks you first','everything else'],['SSH','none'],['Websites','none']])}
  </div>
  <p class="x-note" style="margin-top:16px">Every permission is described one way: runs without asking, asks you first, or never.</p>`;

const sidebarCard = () => `
  <div class="x-sidecard">
    <div class="x-person">household-agent</div>
    <div class="x-note" style="margin-top:4px"><span class="x-status"><i></i>Active</span> · agent token</div>
    <div class="x-token">Token <span style="margin-left:auto">••••••••</span> <button class="x-btn link">Manage</button></div>
    <nav class="x-anchors">
      <a href="#" class="${view === 'agent' ? 'active' : ''}">Overview</a>
      <a href="#" class="${['ha','editor','preview'].includes(view) ? 'active' : ''}">Home Assistant <span>8</span></a>
      <a href="#">Other tools <span>1</span></a>
      <a href="#">SSH <span>none</span></a>
      <a href="#">Websites <span>5</span></a>
      <a href="#">Activity</a>
    </nav>
  </div>`;

const overview = () => `
  <div class="x-agent-layout">
    ${sidebarCard()}
    <div>
      <div class="x-top" style="margin-bottom:18px"><div><h1 style="font-size:27px">Overview</h1><p class="x-sub">Runs on its own in Home Assistant, and nowhere else.</p></div></div>
      <div class="x-outcome-key"><span><i class="x-dot run"></i>Runs without asking</span><span><i class="x-dot ask"></i>Asks you first</span><span><i class="x-dot never"></i>Never</span></div>
      <div class="x-summary">
        <div class="x-summary-card"><b>Runs without asking</b><span>6 devices · turn on and off</span></div>
        <div class="x-summary-card"><b>Asks you first</b><span>every other Home Assistant service</span></div>
        <div class="x-summary-card"><b>Never</b><span>scripts and automations</span></div>
        <div class="x-summary-card"><b>Websites</b><span>5 read-only sites</span></div>
      </div>
      <section class="x-section">
        <div class="x-section-head"><div><h2>Home Assistant</h2><p class="x-note" style="margin-top:4px">Six devices can be switched without a card. A ninth plug is added here too.</p></div><button class="x-btn">Edit permissions</button></div>
        <div class="x-panel">
          <div class="x-panel-head"><div><h3>Runs without asking</h3><p class="x-note" style="margin-top:4px">Turn off 6 devices · Turn on 5 devices</p></div><span class="x-note">8 devices</span></div>
          <div class="x-panel-body">
            <p class="x-note">Device rows and the protected lock are shown in the Home Assistant view of this mock.</p>
            <div class="x-links"><a href="#">Limits for all agents</a><a href="#">Never allowed</a></div>
          </div>
        </div>
      </section>
      <section class="x-section"><div class="x-section-head"><h2>Other tools</h2><button class="x-btn ghost">Review tools</button></div><div class="x-panel"><div class="x-panel-body"><div class="x-perm"><div><b>Home Assistant reads</b><br><span>list entities, get entity, history</span></div><div class="x-perm-actions"><span class="x-note">Runs without asking</span></div></div><div class="x-perm"><div><b>Home Assistant call service</b><br><span>Always asks — Eshu requires approval for this tool</span></div><div class="x-perm-actions"><span class="x-note">Always asks</span></div></div></div></div></section>
      <section class="x-section"><div class="x-section-head"><h2>SSH</h2><span class="x-note">No hosts allowed</span></div></section>
      <section class="x-section"><div class="x-section-head"><h2>Websites</h2><span class="x-note">5 read-only sites</span></div><div class="x-panel"><div class="x-panel-body"><p class="x-note">docs.example.com · example.org · status.example.net</p></div></div></section>
      <section class="x-section"><div class="x-section-head"><h2>Activity</h2><button class="x-btn link">Show all in History</button></div><p class="x-note">Last used 4 minutes ago · 18 calls this week.</p></section>
    </div>
  </div>`;

const deviceRow = (name, area, state, off, on, protectedRow) => `
  <tr class="${protectedRow ? 'x-protected-row' : ''}">
    <td><div class="x-device-name">${name}</div><div class="x-device-meta">${area}</div></td>
    <td><span class="x-device-state">${state}</span></td>
    ${protectedRow
      ? '<td colspan="2"><span class="x-protected"><span class="x-lock"></span>Protected</span></td>'
      : `<td><span class="x-check ${off ? 'on' : 'off'}">${off ? '✓' : ''}</span></td><td><span class="x-check ${on ? 'on' : 'off'}">${on ? '✓' : ''}</span></td>`}
  </tr>`;

const haPanel = (editor = false, preview = false) => {
  const rows = [
    deviceRow('Bedroom plug 1', 'Bedroom · plug', 'on', true, true, false),
    deviceRow('Christmas tree', 'Living room · plug', 'off', true, true, false),
    deviceRow('Office heater', 'Office · plug', 'on', true, false, false),
    deviceRow('Coffee machine', 'Kitchen · plug', 'off', true, true, false),
    deviceRow('Desk lamp', 'Office · light', 'on', true, true, false),
    deviceRow('Hallway night light', 'Hallway · light', 'off', true, true, false),
    deviceRow('Homelab plug', 'Utility · plug', 'on', false, false, true),
    deviceRow('Garage door', 'Outside · cover', 'closed', false, false, true),
  ].join('');
  const body = `
    <div class="x-panel-head"><div><h3>Runs without asking</h3><p class="x-note" style="margin-top:4px">${editor ? 'Choose the devices this agent may switch without asking.' : 'Six devices. Everything else asks you first.'}</p></div><button class="x-btn">${editor ? 'Done' : 'Edit'}</button></div>
    ${editor ? `
      <div class="x-editor-tools"><input class="x-search" placeholder="Search devices" value=""><span class="x-chip on">All devices</span><span class="x-chip">Plugs</span><span class="x-chip">Lights</span><button class="x-btn link">Show settings entities</button></div>
      <div class="x-labelbox"><div><b style="font-size:12px">Follow a Home Assistant label</b><p>All “Household plugs” devices, including any added later. New devices wait for your review.</p></div><button class="x-btn ghost">Choose label</button></div>
    ` : ''}
    <table class="x-device-table"><thead><tr><th style="width:42%">Device</th><th style="width:14%">State</th><th style="width:22%">Turn off</th><th style="width:22%">Turn on</th></tr></thead><tbody><tr><td colspan="4" class="x-device-group">Living room</td></tr>${rows}</tbody></table>
    ${editor ? `<div class="x-labelbox" style="display:block;background:transparent"><div class="x-limit-row">Limit each permission to <input value="30"> times an hour, only between <input value="07:00"> and <input value="23:00">.</div><p class="x-note" style="margin-top:7px">Protected devices are locked. Changes apply only to this agent.</p></div><div class="x-editor-foot"><span class="x-note">7 devices selected · 2 protected</span><button class="x-btn primary">Preview changes</button></div>` : `<div class="x-panel-body" style="padding-top:0"><div class="x-hint">Settings entities (child lock, LED, auto-off) are hidden. <button class="x-btn link">Show settings entities</button> · <span class="x-protected"><span class="x-lock"></span>2 protected devices</span></div><div class="x-links"><a href="#">Limits for all agents</a><a href="#">Never allowed</a></div></div>`}`;
  if (preview) {
    const grid = `<div class="x-panel" style="margin-top:14px"><table class="x-device-table"><thead><tr><th style="width:42%">Device</th><th style="width:14%">State</th><th style="width:22%">Turn off</th><th style="width:22%">Turn on</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    return `<div class="x-preview"><h3>Ready to save</h3><p>household-agent will be able to turn off 6 plugs and turn on 5. Removed: Office heater (turn on).</p><p class="x-note">2 protected devices were skipped. Nothing has changed yet.</p><div class="x-changes"><span><b>Turn off</b> Bedroom plug 1, Christmas tree, Office heater, Coffee machine, Desk lamp, Hallway night light, Living-room lamp</span><span><b>Turn on</b> Bedroom plug 1, Christmas tree, Coffee machine, Desk lamp, Hallway night light</span></div></div>${grid}<div class="x-savebar"><span>3 changes</span><button class="x-btn ghost">Discard</button><button class="x-btn primary">Save changes</button></div>`;
  }
  return editor ? `<div class="x-editor">${body}</div>` : `<div class="x-panel">${body}</div>`;
};

const haPage = (editor = false) => `
  <div class="x-agent-layout">
    ${sidebarCard()}
    <div>
      <div class="x-top" style="margin-bottom:18px"><div><h1 style="font-size:27px">Home Assistant</h1><p class="x-sub">Permissions by device name. Everything else asks you first.</p></div></div>
      <div class="x-outcome-key"><span><i class="x-dot run"></i>Runs without asking</span><span><i class="x-dot ask"></i>Asks you first</span><span><i class="x-dot never"></i>Never</span></div>
      <section class="x-section" style="margin-top:18px">${haPanel(editor)}</section>
      ${editor ? '' : '<p class="x-note" style="margin-top:12px">Changes are saved together from the bar at the bottom.</p>'}
    </div>
  </div>`;

const previewPage = () => `
  <div class="x-agent-layout">
    ${sidebarCard()}
    <div>
      <div class="x-top" style="margin-bottom:18px"><div><h1 style="font-size:27px">Review changes</h1><p class="x-sub">Nothing changes until you save.</p></div></div>
      <section class="x-section" style="margin-top:8px">${haPanel(false, true)}</section>
    </div>
  </div>`;

const overviewPage = () => `
  <div class="x-top"><div><h1>Runs without asking</h1><p class="x-sub">Every permission across every agent, in one place. Everything else asks you first.</p></div><button class="x-btn ghost">Limits for all agents</button></div>
  <div class="x-suspended"><div class="x-suspended-head"><div><h3>1 permission is paused</h3><p>household-agent · Bedroom plug 1 — the device changed in Home Assistant. Review it before it can run again.</p></div><button class="x-btn">Review</button></div></div>
  <div class="x-agent-block"><div class="x-agent-block-head"><div><b>household-agent</b> <span class="x-note">· 8 devices</span></div><div class="x-perm-actions"><button class="x-btn link">Edit</button></div></div>
    <div class="x-perm"><div><b>Turn off</b> <span>Bedroom plug 1, Christmas tree, Office heater, Coffee machine, Desk lamp, Hallway night light, Living-room lamp (7)</span></div><div class="x-perm-actions"><button class="x-btn link">Revoke</button></div></div>
    <div class="x-perm"><div><b>Turn on</b> <span>Bedroom plug 1, Christmas tree, Coffee machine, Desk lamp, Hallway night light (5)</span></div><div class="x-perm-actions"><button class="x-btn link">Revoke</button></div></div>
  </div>
  <div class="x-agent-block"><div class="x-agent-block-head"><div><b>study-agent</b> <span class="x-note">· 3 lights</span></div><div class="x-perm-actions"><button class="x-btn link">Edit</button></div></div>
    <div class="x-perm"><div><b>Turn on</b> <span>Desk lamp, Study lamp, Reading light (3)</span></div><div class="x-perm-actions"><button class="x-btn link">Revoke</button></div></div>
  </div>
  <div class="x-agent-block"><div class="x-agent-block-head"><div><b>garden-agent</b> <span class="x-note">· 2 lights</span></div><div class="x-perm-actions"><button class="x-btn link">Edit</button></div></div>
    <div class="x-perm"><div><b>Turn on</b> <span>Garden path light, Patio light (2)</span></div><div class="x-perm-actions"><button class="x-btn link">Revoke</button></div></div>
  </div>
  <div class="x-bottom-grid">
    <details class="x-collapsed"><summary>Limits for all agents</summary><p>The outer boundary: which device types and actions any agent may ever be given. Open to review or change the limits.</p></details>
    <details class="x-collapsed"><summary>Never allowed</summary><p>Scripts, automations, shell commands and the never-words. Read-only reference, except for adding a word.</p></details>
  </div>
  <section class="x-section"><div class="x-section-head"><div><h2>Protected devices</h2><p class="x-note" style="margin-top:4px">No agent can be given these, even by label.</p></div><button class="x-btn ghost">Add a device</button></div><div class="x-panel"><div class="x-panel-body x-protected-list"><div class="x-perm"><div><b>Homelab plug</b> <span>Utility · plug</span></div><span class="x-protected"><span class="x-lock"></span>Protected</span></div><div class="x-perm"><div><b>Garage door</b> <span>Outside · cover</span></div><span class="x-protected"><span class="x-lock"></span>Protected</span></div></div></div></section>`;

let html = '';
if (view === 'agents') html = agentsPage();
else if (view === 'agent') html = overview();
else if (view === 'ha') html = haPage(false);
else if (view === 'editor') html = haPage(true);
else if (view === 'preview') html = previewPage();
else if (view === 'overview') html = overviewPage();
document.getElementById('page').innerHTML = html;
</script>
</body>
</html>
